name: wip-log
on:
  push:
    branches: [wip-wheel]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          mkdir -p out
          set +e
          ./gradlew build --no-daemon > out/build.log 2>&1
          echo $? > out/exit.txt
          exit 0
      - name: Publish log to ci-logs branch
        run: |
          printf 'sha=%s\nexit=%s\n' "$GITHUB_SHA" "$(cat out/exit.txt)" > out/status.txt
          cd out
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "build output for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
