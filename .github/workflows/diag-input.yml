name: diag-input
on:
  push:
    branches: [diag-input]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (populates caches)
        run: |
          mkdir -p diag
          ./gradlew build --no-daemon 2>&1 | tee diag/build.log
      - name: Dump input handling bytecode
        run: |
          find ~/.gradle .gradle -name '*.jar' -size +5M 2>/dev/null > diag/jars.txt || true
          MC=""
          while read -r j; do
            if unzip -l "$j" net/minecraft/client/Minecraft.class >/dev/null 2>&1; then MC="$j"; break; fi
          done < diag/jars.txt
          echo "$MC" > diag/mcjar.txt
          for c in net.minecraft.client.gui.screens.Screen \
                   net.minecraft.client.gui.components.events.ContainerEventHandler \
                   net.minecraft.client.gui.components.events.AbstractContainerEventHandler \
                   net.minecraft.client.gui.components.events.GuiEventListener \
                   net.minecraft.client.gui.components.AbstractWidget \
                   net.minecraft.client.gui.components.EditBox \
                   net.minecraft.client.MouseHandler; do
            javap -c -p -cp "$MC" "$c" > "diag/$c.txt" 2>&1 || true
          done
          ls -la diag
      - name: Publish CI output to ci-logs branch
        if: always()
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out && cp -r diag/. /tmp/out/ || true
          rm -f /tmp/out/jars.txt
          printf 'sha=%s\nstatus=%s\n' "$GITHUB_SHA" "${{ job.status }}" > /tmp/out/status.txt
          cd /tmp/out
          git init -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "ci output for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
